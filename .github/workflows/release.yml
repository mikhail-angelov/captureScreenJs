name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.0.0"
        required: true

permissions:
  contents: write

env:
  TINYJS_VERSION: v0.50.1

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache the tinyjs release
        uses: actions/cache@v4
        with:
          path: .tinyjs-cli
          key: tinyjs-${{ runner.os }}-${{ runner.arch }}-${{ env.TINYJS_VERSION }}

      - name: Backend tests (txiki.js runtime)
        run: npm run test:backend

      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Frontend tests
        run: npm run test:frontend

  release:
    name: Build and publish the macOS app
    needs: test
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve the release tag
        id: release_tag
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Stamp the version into tinyjs.json
        run: |
          node -e '
            const fs = require("fs");
            const file = "tinyjs.json";
            const cfg = JSON.parse(fs.readFileSync(file, "utf8"));
            cfg.version = process.argv[1];
            fs.writeFileSync(file, JSON.stringify(cfg, null, 2) + "\n");
          ' "${{ steps.release_tag.outputs.version }}"
          cat tinyjs.json

      - name: Cache the tinyjs release
        uses: actions/cache@v4
        with:
          path: .tinyjs-cli
          key: tinyjs-${{ runner.os }}-${{ runner.arch }}-${{ env.TINYJS_VERSION }}

      - name: Fetch the tinyjs release
        run: sh scripts/get-tjs.sh

      - name: Build, sign and package the macOS app
        env:
          # Signing and notarization stay off unless the secrets are configured.
          TINYJS_SIGN_IDENTITY: ${{ secrets.TINYJS_SIGN_IDENTITY }}
          TINYJS_NOTARY_PROFILE: ${{ secrets.TINYJS_NOTARY_PROFILE }}
          VERSION: ${{ steps.release_tag.outputs.version }}
        run: |
          set -eu
          mkdir -p out
          for arch in arm64 x86_64; do
            ./.tinyjs-cli/tinyjs build --arch "$arch"
            APP=$(find dist -maxdepth 1 -name '*.app' | head -1)
            if [ -z "$APP" ]; then
              echo "::error::no .app bundle was produced for $arch"
              exit 1
            fi

            if [ -n "${TINYJS_NOTARY_PROFILE:-}" ]; then
              ./.tinyjs-cli/tinyjs notarize --arch "$arch" || echo "::warning::notarization failed for $arch"
            fi

            (cd dist && zip -qry "../out/shotmark-${VERSION}-${arch}.zip" "$(basename "$APP")")
            rm -rf "$APP"
          done

          (cd out && shasum -a 256 shotmark-*.zip > checksums.txt)
          ls -la out

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: ShotMark ${{ steps.release_tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            out/shotmark-*.zip
            out/checksums.txt
