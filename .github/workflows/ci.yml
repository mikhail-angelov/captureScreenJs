name: CI and macOS release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    name: Test and build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          architecture: ${{ matrix.arch }}
          cache: npm
      - name: Check architecture and release version
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          if (process.arch !== process.env.EXPECTED_ARCH) throw new Error('Incorrect Node.js architecture');
          const { version } = JSON.parse(readFileSync('tinyjs.json', 'utf8'));
          if (process.env.GITHUB_REF_TYPE === 'tag' && process.env.GITHUB_REF_NAME !== `v${version}`) {
            throw new Error(`Release tag must match tinyjs.json: v${version}`);
          }
          JS
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm test
      - run: npm run build
      - run: npm run package
      - name: Upload macOS package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shotmark-macos-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error
      - name: Upload test failure details
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.arch }}
          path: test-results/
          if-no-files-found: ignore

  release:
    name: Publish GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      # Fine-grained token with contents: write on mikhail-angelov/homebrew-tap only.
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: shotmark-macos-*
          path: release
          merge-multiple: true
      - name: Publish archives and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          args=(--verify-tag --generate-notes --title "ShotMark $GITHUB_REF_NAME")
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "${args[@]}" release/*.zip release/*.sha256
      # Prereleases stay out of Homebrew. Skipped until the HOMEBREW_TAP_TOKEN secret exists, so a release never fails on it.
      - name: Update Homebrew cask
        if: env.HOMEBREW_TAP_TOKEN != '' && !contains(github.ref_name, '-')
        run: |
          version="${GITHUB_REF_NAME#v}"
          git clone --depth 1 "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/mikhail-angelov/homebrew-tap.git" tap
          node scripts/cask.mjs "$version" release > tap/Casks/shotmark.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/shotmark.rb
          git commit -m "shotmark $version"
          git push
